- section: further-reading
  type: text
  layout: two-col
  headline: Further reading
  content: |
    Studies and papers on the principle behind both approaches: integrate early, deliver continuously,
    agree before you build.

    ### Start with a running system
    - Basili, V. R., Turner, A. J. (1975): [*Iterative Enhancement: A Practical Technique for Software Development*](https://www.cs.umd.edu/~basili/publications/journals/J04.pdf).
      IEEE Transactions on Software Engineering SE-1 (4). An initial skeleton, grown step by step; the
      earliest form of the idea.
    - Hunt, A., Thomas, D. (1999): [*The Pragmatic Programmer*](https://pragprog.com/titles/tpp20/the-pragmatic-programmer-20th-anniversary-edition/).
      Addison-Wesley. Tracer bullets: code that reaches the target end to end and shows how far off it is.
    - Freeman, S., Pryce, N. (2009): [*Growing Object-Oriented Software, Guided by Tests*](https://growing-object-oriented-software.com/).
      Addison-Wesley. Their walking skeleton, the thinnest slice that is built, deployed and tested end to
      end before any feature, is the closest relative of White Page First. White Page First proves the way
      to production first, takes it all the way there, and adds the contract.
    - Humble, J., Farley, D. (2010): [*Continuous Delivery*](https://continuousdelivery.com/).
      Addison-Wesley. The deployment pipeline as the backbone of a project, with cheap checks first.
    - Fowler, M. (2024): [*Continuous Integration*](https://martinfowler.com/articles/continuousIntegration.html).
      The classic description of integrating at least daily so problems surface while they are small. The
      2024 revision weighs it against feature branching.

    ### Evidence for continuous delivery
    - Forsgren, N., Humble, J., Kim, G. (2018): [*Accelerate*](https://itrevolution.com/product/accelerate/).
      IT Revolution. Four years of survey data: frequent, small deployments go together with higher
      stability, not lower. Continued in the [DORA research programme](https://dora.dev/research/).
    - Chen, L. (2015): [*Continuous Delivery: Huge Benefits, but Challenges Too*](https://doi.org/10.1109/MS.2015.27).
      IEEE Software 32 (2). Two years of adopting continuous delivery at a large company.
    - Vasilescu, B. et al. (2015): [*Quality and Productivity Outcomes Relating to Continuous Integration in GitHub*](https://doi.org/10.1145/2786805.2786850).
      ESEC/FSE 2015. Teams with CI integrate more contributions without a drop in quality.
    - Hilton, M. et al. (2016): [*Usage, Costs, and Benefits of Continuous Integration in Open-Source Projects*](https://doi.org/10.1145/2970276.2970358).
      ASE 2016. Projects using CI release more often.
    - Shahin, M., Babar, M. A., Zhu, L. (2017): [*Continuous Integration, Delivery and Deployment: A Systematic Review*](https://doi.org/10.1109/ACCESS.2017.2685629).
      IEEE Access 5. Overview of 69 studies on approaches, tools and challenges.
    - Laukkanen, E., Itkonen, J., Lassenius, C. (2017): [*Problems, Causes and Solutions When Adopting Continuous Delivery*](https://doi.org/10.1016/j.infsof.2016.10.001).
      Information and Software Technology 82. What makes adoption hard, and what helps.

    ### The cost of finding problems late
    - RTI for NIST (2002): [*The Economic Impacts of Inadequate Infrastructure for Software Testing*](https://www.nist.gov/document/report02-3pdf).
      Planning Report 02-3. Estimates the annual cost of inadequate testing to the US economy at 59.5 billion
      dollars, and how much of it earlier detection could save.
    - Menzies, T., Nichols, W., Shull, F., Layman, L. (2017): [*Are Delayed Issues Harder to Resolve?*](https://doi.org/10.1007/s10664-016-9469-x)
      Empirical Software Engineering 22. A counterpoint: in 171 projects the cost of fixing issues late was not
      consistently higher. The effect depends on context.

    ### Contracts between teams
    - Robinson, I. (2006): [*Consumer-Driven Contracts: A Service Evolution Pattern*](https://martinfowler.com/articles/consumerDrivenContracts.html).
      Consumers state their expectations as executable contracts that providers test against.
    - Espinha, T., Zaidman, A., Gross, H.-G. (2014): [*Web API Growing Pains: Stories from Client Developers and Their Code*](https://doi.org/10.1109/CSMR-WCRE.2014.6747228).
      CSMR-WCRE 2014. What unannounced API changes cost the teams that consume them.
    - Brito, A. et al. (2018): [*Why and How Java Developers Break APIs*](https://arxiv.org/abs/1801.05198).
      SANER 2018. Most breaking changes come from new features and simplification, rarely from necessity.
    - Lercher, A. et al. (2024): [*Microservice API Evolution in Practice: A Study on Strategies and Challenges*](https://arxiv.org/abs/2311.08175).
      Journal of Systems and Software. Interviews in 11 companies: backward compatibility, versioning and
      communication between teams decide whether APIs can evolve.
    - Postman (2025): [*State of the API Report*](https://www.postman.com/state-of-api/2025/).
      Industry survey on the spread of API-first development.

