  content: |
    - Project Management Institute (2024): [*PMI Champions a New Era of "Project Success"*](https://www.pmi.org/about/press-media/press-releases/pmi-champions-a-new-era-of-project-success).
      Press release on the study *Maximizing Project Success*.
    - Ryseff, J., De Bruhl, B., Newberry, S. J. (2024): [*The Root Causes of Failure for Artificial
      Intelligence Projects and How They Can Succeed*](https://www.rand.org/pubs/research_reports/RRA2680-1.html). RAND Corporation, RR-A2680-1.
    - Informatica (2025): [*CDO Insights 2025: Racing Ahead on GenAI and Data Investments While Navigating
      Potential Speed Bumps*](https://www.informatica.com/about-us/news/news-releases/2025/01/20250128-global-data-leaders-seek-to-harness-the-power-of-genai-for-ai-driven-success.html).
    - S&P Global Market Intelligence (2025): [*AI experiences rapid adoption, but with mixed outcomes*](https://www.spglobal.com/market-intelligence/en/news-insights/research/ai-experiences-rapid-adoption-but-with-mixed-outcomes-highlights-from-vote-ai-machine-learning).
      Highlights from Voice of the Enterprise: AI & Machine Learning, Use Cases 2025.
    - Boehm, B., Basili, V. R. (2001): [*Software Defect Reduction Top 10 List*](https://doi.org/10.1109/2.962984).
      IEEE Computer 34 (1), 135–137.
    - Cockburn, A. (1996, archived 2014): [*Walking skeleton*](https://web.archive.org/web/20140329201356/http://alistair.cockburn.us/Walking+skeleton).
      The original description, with the excerpt from *Crystal Clear* and the distinction from a spike.
    - Cockburn, A. (2004): [*Crystal Clear: A Human-Powered Methodology for Small Teams*](https://www.informit.com/store/crystal-clear-a-human-powered-methodology-for-small-9780201699470).
      Addison-Wesley, ISBN 978-0-201-69947-0. Walking skeleton, early victory, incremental rearchitecture
      and information radiators as strategies.
    - Cockburn, A.: [*Bio*](https://alistaircockburn.com/Bio). Dates the walking skeleton to 1996 and lists
      the other terms he coined; see also [Wikipedia](https://en.wikipedia.org/wiki/Alistair_Cockburn).
    - Cockburn, A. (2005): [*Hexagonal Architecture*](https://alistair.cockburn.us/hexagonal-architecture/).
      Ports and adapters.
    - Needham, M. (2008): [*Crystal Clear: Book Review*](https://www.markhneedham.com/blog/2008/11/05/crystal-clear-book-review/).
      The walking skeleton as a strategy for tackling the highest risk first.
    - Fowler, M. (2000, rewritten 2006, revised 2024): [*Continuous Integration*](https://martinfowler.com/articles/continuousIntegration.html).
    - Fowler, M.: articles on [delivery](https://martinfowler.com/tags/delivery.html), among them
