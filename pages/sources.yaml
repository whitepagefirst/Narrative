      [*BranchByAbstraction*](https://martinfowler.com/bliki/BranchByAbstraction.html),
      [*BlueGreenDeployment*](https://martinfowler.com/bliki/BlueGreenDeployment.html),
      [*InfrastructureAsCode*](https://martinfowler.com/bliki/InfrastructureAsCode.html),
      [*PhoenixServer*](https://martinfowler.com/bliki/PhoenixServer.html) and
      [*FrequencyReducesDifficulty*](https://martinfowler.com/bliki/FrequencyReducesDifficulty.html).
    - Hodgson, P. (2016): [*Feature Toggles (aka Feature Flags)*](https://martinfowler.com/articles/feature-toggles.html).
    - Sato, D. (2014): [*CanaryRelease*](https://martinfowler.com/bliki/CanaryRelease.html).
    - Morris, K. (2013): [*ImmutableServer*](https://martinfowler.com/bliki/ImmutableServer.html).
    - Falé, F., Gebhardt, S. (2017): [*SyntheticMonitoring*](https://martinfowler.com/bliki/SyntheticMonitoring.html).
    - Rüger, F. (2026): *Contract First API Development – Overview*. Internal wiki, as of 30 September 2026
      (not publicly available).
    - *CI/CD Pipelines*. Internal development wiki (not publicly available).
    - OpenAPI Initiative: [*OpenAPI Specification*](https://spec.openapis.org/oas/latest.html).

