  content: |
    Every stage is a quality gate.

- section: minimal-start
  type: text
  layout: two-col
  headline: The minimal start
  content: |
    A project following this approach deliberately starts small. If it provides or uses interfaces, it
    begins with a minimal API contract that all teams involved design together, in the simplest case a
    single health or "Hello World" endpoint. Alongside it comes an application that does nothing but fulfil
    this contract, and a pipeline that checks contract and application, builds them and delivers them to the
    staging or production system.

    This looks trivial, but it isn't. With this first run the deployment pipeline is proven, permissions are
    sorted out and the workflow is established. At the same time the team has already practised agreeing on
    interfaces once, and contract linting and contract tests are anchored in the pipeline before the first
    line of business code is written. This ensures that everything developed next can actually reach
    production, and that everyone involved knows how to agree on changes to the interface together.

- section: incremental-growth
  type: text
  layout: two-col
  headline: Incremental growth
  content: |
    On this foundation the system grows in small steps. For every new feature the contract is extended and
    agreed first. Then providers and consumers develop in parallel, the pipeline checks the implementation
    against the contract, and the result is shipped. Every one of these cycles ends with a working system
    that runs in production. There is no longer a "big bang" at the end of the project, where it shows for
    the first time whether everything fits together.

    In short: traditionally the sequence is *develop → document the API → integrate → test → hope →
    deploy*. Combining both approaches, it becomes *agree on the contract and deploy minimally → develop in
    parallel → test against the contract → deploy the extension → repeat*. The difference may look small,
    but its effects are fundamental: you don't build on assumptions, you build on a tested foundation.

