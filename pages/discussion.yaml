# Section types are described at the top of wpf.yaml.

- section: hero
  type: hero
  headline: Discussion
  drawing: balance
  content: |
    Benefits, objections, and where the approach has its limits.

- section: benefits
  type: text
  layout: two-col
  headline: Benefits
  content: |
    The most obvious benefit is early detection. A configuration error in the deployment is found on the first day of the
    project, not after three months of development; a misunderstanding about a data format shows up while the contract is
    agreed, not only during integration. A widely cited rule of thumb says that a bug found in production costs up to a
    hundred times more than one found during development ([Boehm & Basili, 2001](https://doi.org/10.1109/2.962984)). The
    exact factor varies from case to case, but the direction of the effect is undisputed.

    A second benefit is constant deliverability. Because every successful pipeline run produces a shippable
    system, a fixed release date is no longer needed. If a customer urgently needs a feature, it can be
    provided as soon as it is finished.

    Less technical debt also piles up. Continuous validation makes shortcuts visible immediately, and an
    agreed contract prevents consumers from having to work around an unsuitable interface.

    Finally, both approaches create transparency. The current state of the project can be seen on the
    running test system at any time, and the contract documents bindingly what the interface does. The
    question "What are you working on right now?" can be answered with a link instead of with the remark
    that it's too complicated.

- section: objections
  type: text
  layout: two-col
  headline: Objections
  content: |
    Objections to this approach come up regularly, but they don't hold up on closer inspection.

    ### "It costs too much at the start"
    The most common objection concerns the initial effort. Setting up a pipeline and designing a contract
    together does take time at the start. But this work is needed in every project; both approaches only
    move it to the beginning, where errors are still cheap to fix. This holds for the contract in
    particular: the interface has to be designed anyway, the only question is whether deliberately and
    together, or on the side in the code. On top of that, the parallel development an early contract
    enables often more than makes up for the time invested at the start.

    ### "We already work agile"
    White Page First and Contract First don't compete with Scrum, Kanban or even the waterfall model. They
    are technical practices, not project management methods, and can be combined with any of these
    frameworks.

    ### "Our application is too complex"
    The opposite is true: the more components, teams and interfaces a system has, the more important it is
    to know early whether everything fits together.

    ### "Isn't this just a walking skeleton?"
    In large part, and gladly so. White Page First shares the
    [walking skeleton's](/walking-skeleton) core: a running system before features, permanent code instead
    of throwaway prototypes, parts that stay joined from the first week on. It differs in its first step and
    in what it makes explicit. It proves the way to production before it connects the architecture, it
    goes to production rather than to a place that resembles it, it writes down every interface as an
    agreed contract, and it gives the pipeline a fixed order. Standing on a good idea is not a weakness; the
    concept says openly where it comes from and where it goes further.

    ### "The sponsor sees nothing for weeks"
    A white page is not a demo, and a sponsor who only sees a "Hello World" may well get nervous. But the
    white page takes days, not weeks, and the first line that follows is a real function, however small.
    Alistair Cockburn reports a first release that did little more than "read a number, write a number":
    it went live on schedule, and the sponsors threw a party. From then on progress is a link to the
    running system, not a slide.

