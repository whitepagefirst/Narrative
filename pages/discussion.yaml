- section: limits
  type: text
  layout: two-col
  headline: Prerequisites and limits
  content: |
    The approach doesn't run by itself. It requires a team that brings or builds up the necessary skills in
    pipeline automation and has the discipline not to bypass the pipeline, even under time pressure.
    Contract First also demands a real culture of agreement: a contract that one team writes alone and only
    presents to the others merely reproduces the silos of code first in a new form. Rules for evolving
    contracts are needed as well, especially for handling breaking changes and their versioning.

    The demand that the main branch always goes straight to production has to be adapted to the context,
    too. In regulated environments approval steps may be mandatory, and unfinished features have to be
    hidden from users through suitable mechanisms such as feature toggles. The principle stays the same:
    every state should be technically shippable there as well, even if the release is approved
    organisationally.

    Finally, Contract First in this form matters mainly for projects that provide or use interfaces. For
    applications without external interfaces, White Page First can be applied on its own. But the idea of
    making agreements explicit before implementing them carries there too, for example for data formats,
    events or configuration.

- section: step-by-step
  type: figure
  layout: left
  drawing: path
  content: |
    Step by step, validated and safe.

- section: conclusion
  type: text
  layout: one-col
  headline: Conclusion
  content: |
    Many failed software projects share a common cause: validation starts too late. White Page First
    addresses this by putting deployment at the start and building every project on a foundation that
    already runs in production. Contract First carries the same thought over to interfaces: the jointly
    agreed API contract comes before the implementation and is binding for everyone involved.

    Both approaches are expressions of the same principle and only reach their full effect together.
    Anchored in a pipeline that checks both deliverability and contract compliance on every run, they form
    a general approach that holds regardless of customer, domain and technology.

    The approach demands discipline and a change of thinking from everyone involved at the start. The gain
    justifies this effort: higher quality, shorter feedback cycles, parallel work and collaboration without
    mutual blame.

    > Start small, deploy a white page, agree on the contract together and build on it: step by step, validated and safe.

