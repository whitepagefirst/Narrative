    type: reader
    layout: one-col
    headline: Please contact us via github
    content:
      $ref: 'contact.md'

  - section: contributors
    type: contributor
    headline: Contributors
    repository: 'whitepagefirst/Narrative'
    content: |
      If you're interested in contributing to WPF and helping to improve it, we invite you to [join our community](https://github.com/whitepagefirst/Narrative) on GitHub. 
