<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 30 300 350" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
	<!-- The skeleton walks once it is drawn (about 3.8 s); with reduced motion it holds its stride.
	     Thighs turn at the hip, shins at the knee, arms swing against the legs, the body rises at
	     mid-stance, and marks on the ground pass backwards at the speed of the planted foot. -->
	<style>
		.wpf-skeleton-leg-a, .wpf-skeleton-leg-b { transform-origin: 205px 246px; }
		.wpf-skeleton-shin-a, .wpf-skeleton-shin-b { transform-origin: 205px 304px; }
		.wpf-skeleton-foot-a, .wpf-skeleton-foot-b { transform-origin: 205px 362px; }
		.wpf-skeleton-arm-a { transform-origin: 170px 124px; }
		.wpf-skeleton-arm-b { transform-origin: 242px 124px; }
		.wpf-skeleton-forearm-a { transform-origin: 152px 168px; }
		.wpf-skeleton-forearm-b { transform-origin: 258px 168px; }
		.wpf-skeleton-leg-a { transform: rotate(-22deg); }
		.wpf-skeleton-leg-b { transform: rotate(18deg); }
		.wpf-skeleton-shin-b { transform: rotate(12deg); }
		.wpf-skeleton-foot-a { transform: rotate(10deg); }
		.wpf-skeleton-foot-b { transform: rotate(-15deg); }
		.wpf-skeleton-arm-a { transform: rotate(8deg); }
		.wpf-skeleton-arm-b { transform: rotate(-8deg); }
		.wpf-skeleton-forearm-a { transform: rotate(-2deg); }
		.wpf-skeleton-forearm-b { transform: rotate(-12deg); }
		.wpf-skeleton-step { opacity: 0; }

		@media (prefers-reduced-motion: no-preference) {
			.wpf-skeleton-body { animation: wpf-skeleton-bob 0.8s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-leg-a { animation: wpf-skeleton-leg-a 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-leg-b { animation: wpf-skeleton-leg-b 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-shin-a { animation: wpf-skeleton-shin-a 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-shin-b { animation: wpf-skeleton-shin-b 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-foot-a { animation: wpf-skeleton-foot-a 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-foot-b { animation: wpf-skeleton-foot-b 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-arm-a { animation: wpf-skeleton-arm-a 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-arm-b { animation: wpf-skeleton-arm-b 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-forearm-a { animation: wpf-skeleton-forearm-a 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-forearm-b { animation: wpf-skeleton-forearm-b 1.6s ease-in-out 3.8s infinite both; }
			.wpf-skeleton-step { animation: wpf-skeleton-step 2.4s linear infinite both; }
			.wpf-skeleton-step-1 { animation-delay: 3.8s; }
			.wpf-skeleton-step-2 { animation-delay: 4.6s; }
			.wpf-skeleton-step-3 { animation-delay: 5.4s; }
		}

		@keyframes wpf-skeleton-bob {
			0%, 100% { transform: translateY(3px); }
			50% { transform: translateY(-3px); }
		}
		@keyframes wpf-skeleton-leg-a {
			0%, 100% { transform: rotate(-22deg); }
			50% { transform: rotate(18deg); }
		}
		@keyframes wpf-skeleton-leg-b {
			0%, 100% { transform: rotate(18deg); }
			50% { transform: rotate(-22deg); }
		}
		@keyframes wpf-skeleton-shin-a {
			0%, 100% { transform: rotate(0deg); }
			20% { transform: rotate(8deg); }
			50% { transform: rotate(12deg); }
			62% { transform: rotate(50deg); }
			82% { transform: rotate(18deg); }
		}
		@keyframes wpf-skeleton-shin-b {
			0%, 100% { transform: rotate(12deg); }
			12% { transform: rotate(50deg); }
			32% { transform: rotate(18deg); }
			50% { transform: rotate(0deg); }
			70% { transform: rotate(8deg); }
		}
		@keyframes wpf-skeleton-foot-a {
			0%, 100% { transform: rotate(10deg); }
			20% { transform: rotate(0deg); }
			50% { transform: rotate(-15deg); }
			62% { transform: rotate(-55deg); }
			82% { transform: rotate(-7deg); }
		}
		@keyframes wpf-skeleton-foot-b {
			0%, 100% { transform: rotate(-15deg); }
			12% { transform: rotate(-55deg); }
			32% { transform: rotate(-7deg); }
			50% { transform: rotate(10deg); }
			70% { transform: rotate(0deg); }
		}
		@keyframes wpf-skeleton-arm-a {
			0%, 100% { transform: rotate(8deg); }
			50% { transform: rotate(-8deg); }
		}
		@keyframes wpf-skeleton-arm-b {
			0%, 100% { transform: rotate(-8deg); }
			50% { transform: rotate(8deg); }
		}
		@keyframes wpf-skeleton-forearm-a {
			0%, 100% { transform: rotate(-2deg); }
			50% { transform: rotate(-12deg); }
		}
		@keyframes wpf-skeleton-forearm-b {
			0%, 100% { transform: rotate(-12deg); }
			50% { transform: rotate(-2deg); }
		}
		@keyframes wpf-skeleton-step {
			0% { transform: translateX(110px); opacity: 0; }
			15%, 85% { opacity: 1; }
			100% { transform: translateX(-110px); opacity: 0; }
		}
	</style>

	<g class="wpf-skeleton-body">
		<path d="M208 52 C 228 52, 240 68, 238 86 C 236 102, 228 110, 216 112 L196 112 C 186 108, 178 98, 178 84 C 178 66, 190 52, 208 52 Z" />
		<circle cx="198" cy="82" r="5" />
		<circle cx="220" cy="82" r="5" />
		<path class="accent" d="M206 114 C 202 150, 210 190, 204 232" />
		<path d="M196 134 L214 134" />
		<path d="M196 156 L214 156" />
		<path d="M196 178 L214 178" />
		<path d="M196 200 L212 200" />
		<path d="M204 140 C 182 140, 170 152, 174 166" />
		<path d="M206 140 C 228 140, 240 152, 236 166" />
		<path d="M205 162 C 186 162, 176 174, 180 186" />
		<path d="M207 162 C 226 162, 236 174, 232 186" />
		<path d="M170 124 C 188 118, 222 118, 242 124" />

		<g class="wpf-skeleton-arm-a">
			<path d="M170 124 L152 168" />
			<g class="wpf-skeleton-forearm-a">
				<path d="M152 168 L156 212" />
				<path d="M156 212 L150 224 M156 212 L162 225" />
			</g>
		</g>
		<g class="wpf-skeleton-arm-b">
			<path d="M242 124 L258 168" />
			<g class="wpf-skeleton-forearm-b">
				<path d="M258 168 L254 212" />
				<path d="M254 212 L248 225 M254 212 L262 224" />
			</g>
		</g>

		<path d="M182 232 C 186 254, 222 256, 228 232 C 214 238, 196 238, 182 232 Z" />

		<g class="wpf-skeleton-leg-b">
			<path d="M205 246 L205 304" />
			<circle cx="205" cy="304" r="4" />
			<g class="wpf-skeleton-shin-b">
				<path d="M205 304 L205 362" />
				<g class="wpf-skeleton-foot-b">
					<path d="M201 362 L229 362" />
				</g>
			</g>
		</g>
		<g class="wpf-skeleton-leg-a">
			<path d="M205 246 L205 304" />
			<circle cx="205" cy="304" r="4" />
			<g class="wpf-skeleton-shin-a">
				<path d="M205 304 L205 362" />
				<g class="wpf-skeleton-foot-a">
					<path d="M201 362 L229 362" />
				</g>
			</g>
		</g>
	</g>

	<path d="M84 364 C 160 362, 260 366, 340 363" />
	<path class="wpf-skeleton-step wpf-skeleton-step-1" d="M202 370 L210 370" />
	<path class="wpf-skeleton-step wpf-skeleton-step-2" d="M202 370 L210 370" />
	<path class="wpf-skeleton-step wpf-skeleton-step-3" d="M202 370 L210 370" />
</svg>
